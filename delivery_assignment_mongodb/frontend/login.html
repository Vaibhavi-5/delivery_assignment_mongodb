<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Assignment System — Sign in</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-bg">
  <div class="card login-card"><div class="card-body p-4">
    <h4 class="fw-bold mb-0" style="color:var(--navy)">🚚 Delivery Assignment System</h4>
    <p class="text-secondary small mb-3">Sign in — one login for Customers, Drivers and Managers</p>
    <div class="alert alert-info py-2 small d-none" id="loginInfo"></div>
    <form id="loginForm" novalidate>
      <div class="mb-3"><label class="form-label fw-semibold" for="loginId">ID / Email</label>
        <input type="text" class="form-control" id="loginId" placeholder="e.g. driver01, customer001, manager1" autocomplete="username" autofocus></div>
      <div class="mb-3"><label class="form-label fw-semibold" for="loginPass">Password</label>
        <input type="password" class="form-control" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
      <button type="submit" class="btn btn-navy w-100" id="btnLogin">Sign In</button>
    </form>
    <div class="alert alert-danger py-2 small mt-3 d-none" id="loginErr"></div>
    <div class="border rounded p-2 mt-3 small bg-light">
      <div class="fw-semibold mb-1">Demo accounts (from <code>python manage.py seed_data</code>)</div>
      Manager: <code>manager1 / Manager@123</code><br>Driver: <code>driver01 / Driver@123</code><br>Customer: <code>customer001 / Customer@123</code>
    </div>
    <div class="text-center text-secondary small mt-3">1 Restaurant · 20 Drivers · 500 Customers</div>
  </div></div>
<script src="auth.js"></script>
<script>
function setInfo(t){const e=document.getElementById("loginInfo");e.textContent=t;e.classList.remove("d-none");}
function setErr(t){const e=document.getElementById("loginErr");e.textContent=t;e.classList.toggle("d-none",!t);}
(async function init() {
  const q = new URLSearchParams(location.search);
  if (q.get("reason") === "expired") setInfo("Your session has expired. Please sign in again.");
  else if (q.get("reason") === "network") setInfo("Could not verify your session (server unreachable). Please sign in again.");
  else if (q.has("logout")) setInfo("You have been signed out.");

  // Already signed in? Go straight to the dashboard — never show this form.
  const home = await DAS.resolveExistingSession();
  if (home) { location.replace(home); return; }
})();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btnLogin"), err = document.getElementById("loginErr");
  setErr("");
  btn.disabled = true;
  try {
    const id = document.getElementById("loginId").value.trim();
    const pw = document.getElementById("loginPass").value;
    if (!id) { setErr("Enter your ID / email."); return; }
    const result = await DAS.login(id, pw);
    if (!result.ok) { setErr(result.error); return; }
    location.replace(DAS.ROLE_HOME[result.session.role]);   // role from the server -> DIRECT to that dashboard
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
